services:
  postgres:
    image: postgres:16
    container_name: sigov-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sigov_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  db-migrations:
    image: postgres:16
    container_name: sigov-db-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/sh", "/database/docker/apply-migrations.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Sigov.Api/Dockerfile
    container_name: sigov-api
    depends_on:
      postgres:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-postgres};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123456};Pooling=true;Maximum Pool Size=50;Minimum Pool Size=0;Timeout=30;Command Timeout=60;Application Name=SigovDocker
      Sigov__Database__Schema: sigov
      Sigov__Database__RunMigrationsOnStartup: "false"
      Sigov__Database__MigrationsPath: /app/database/postgres/migrations
      Sigov__Storage__Provider: Local
      Sigov__Storage__LocalPath: ${APP_STORAGE_PATH:-/app/storage}
      Sigov__Security__SwaggerEnabledInProduction: "false"
      Database__ValidateSchemaOnStartup: ${DATABASE_VALIDATE_SCHEMA_ON_STARTUP:-true}
      Database__FailFastOnInvalidSchema: ${DATABASE_FAIL_FAST_ON_INVALID_SCHEMA:-false}
      Database__DisableWorkersWhenSchemaInvalid: ${DATABASE_DISABLE_WORKERS_WHEN_SCHEMA_INVALID:-true}
      OcrWorker__Enabled: ${OCR_WORKER_ENABLED:-false}
      PreviewWorker__Enabled: ${PREVIEW_WORKER_ENABLED:-false}
      Workers__LoanOverdue__Enabled: ${LOAN_OVERDUE_WORKER_ENABLED:-false}
    ports:
      - "${APP_API_HTTP_PORT:-5001}:8080"
    volumes:
      - sigov_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Sigov.Worker/Dockerfile
    container_name: sigov-worker
    depends_on:
      postgres:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-postgres};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123456};Pooling=true;Application Name=SigovWorkerDocker
      Workers__Outbox__Enabled: ${OUTBOX_WORKER_ENABLED:-false}
      OcrWorker__Enabled: ${OCR_WORKER_ENABLED:-false}
      PreviewWorker__Enabled: ${PREVIEW_WORKER_ENABLED:-false}
      Workers__LoanOverdue__Enabled: ${LOAN_OVERDUE_WORKER_ENABLED:-false}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Sigov.Web/Dockerfile
    container_name: sigov-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-postgres};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123456};Pooling=true;Application Name=SigovWebDocker
      Sigov__ApiBaseUrl: http://api:8080
      Sigov__Brand__Name: ${SIGOV_BRANDING_NAME:-SIGOV}
      Sigov__ReleaseChannel: ${SIGOV_RELEASE_CHANNEL:-dev}
      Storage__Local__RootPath: ${APP_STORAGE_PATH:-/app/storage}
      OcrWorker__Enabled: ${OCR_WORKER_ENABLED:-false}
      PreviewWorker__Enabled: ${PREVIEW_WORKER_ENABLED:-false}
      Workers__LoanOverdue__Enabled: ${LOAN_OVERDUE_WORKER_ENABLED:-false}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    volumes:
      - sigov_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  sigov_pgdata:
  sigov_storage:
