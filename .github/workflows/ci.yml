name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main, codex/pos-rc-27a1-desbloquear-ci-integral ]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go for actionlint
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: |
          set -Euo pipefail
          touch workflow-integrity-install.log workflow-integrity.log
          trap 'code=$?; echo "Falha na linha ${LINENO}; comando=${BASH_COMMAND}; exit=${code}" | tee -a workflow-integrity-install.log; exit ${code}' ERR
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          export PATH="$GOBIN:$PATH"
          {
            echo "Go:"
            go version
            echo "Actionlint module:"
            echo "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
            go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
            "$GOBIN/actionlint" -version
          } 2>&1 | tee -a workflow-integrity-install.log
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Validate workflow structure and required scripts
        run: |
          set -Euo pipefail
          touch workflow-integrity.log workflow-integrity-result.json
          actionlint_exit=0
          validator_exit=0
          actionlint_version="$(actionlint -version 2>&1 | head -n 1 || true)"
          actionlint .github/workflows/ci.yml 2>&1 | tee -a workflow-integrity.log || actionlint_exit=$?
          python3 scripts/validate-workflow-integrity.py .github/workflows/ci.yml 2>&1 | tee -a workflow-integrity.log || validator_exit=$?
          status=success
          if [ "$actionlint_exit" -ne 0 ] || [ "$validator_exit" -ne 0 ]; then status=failed; fi
          STATUS="$status" ACTIONLINT_VERSION_REPORTED="$actionlint_version" ACTIONLINT_EXIT="$actionlint_exit" VALIDATOR_EXIT="$validator_exit" python3 -c 'import datetime,json,os; result={"status":os.environ["STATUS"],"actionlintVersion":os.environ["ACTIONLINT_VERSION_REPORTED"],"actionlintExitCode":int(os.environ["ACTIONLINT_EXIT"]),"customValidatorExitCode":int(os.environ["VALIDATOR_EXIT"]),"timestampUtc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"commitSha":os.environ.get("GITHUB_SHA","")}; open("workflow-integrity-result.json","w",encoding="utf-8").write(json.dumps(result,indent=2)+"\n")'
          if [ "$actionlint_exit" -ne 0 ] || [ "$validator_exit" -ne 0 ]; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-integrity-artifacts
          path: |
            workflow-integrity-install.log
            workflow-integrity.log
            workflow-integrity-result.json

  release-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      release_directory: ${{ steps.version.outputs.release_directory }}
      post_rc: ${{ steps.version.outputs.post_rc }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read centralized version
        run: |
          set -euo pipefail
          version=$(jq -r '.version' eng/version.json)
          post_rc=$(jq -r '.postRc' eng/version.json)
          artifact_name="sigov-plus-${version}"
          release_directory="artifacts/release/${artifact_name}"
          {
            echo "version=${version}"
            echo "post_rc=${post_rc}"
            echo "artifact_name=${artifact_name}"
            echo "release_directory=${release_directory}"
          } >> "$GITHUB_OUTPUT"
          jq . eng/version.json | tee release-context.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-context-log
          path: release-context.log

  build-test:
    needs: [workflow-integrity, release-context]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=sigov;Username=sigov;Password=sigov_ci_password
      Sigov__Jwt__Secret: ci-only-secret-with-more-than-thirty-two-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: dotnet --info | tee dotnet-info.log
      - run: dotnet restore sigov.sln
      - run: |
          set -euo pipefail
          dotnet build sigov.sln --configuration Release --no-restore 2>&1 | tee build.log
      - run: |
          set -euo pipefail
          dotnet test sigov.sln --configuration Release --no-build --logger trx --results-directory TestResults 2>&1 | tee test.log
          python3 scripts/validate-trx-results.py 'TestResults/**/*.trx' --json-output artifacts/tests/build-test/test-summary.json --markdown-output artifacts/tests/build-test/test-summary.md | tee -a test.log
      - run: |
          set -euo pipefail
          dotnet format sigov.sln --verify-no-changes --no-restore 2>&1 | tee format.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-artifacts
          path: |
            dotnet-info.log
            build.log
            test.log
            format.log
            artifacts/tests/build-test/test-summary.json
            artifacts/tests/build-test/test-summary.md
            TestResults/**/*.trx

  dependency-injection:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: |
          set -euo pipefail
          dotnet test tests/Sigov.UnitTests/Sigov.UnitTests.csproj --configuration Release --filter "FullyQualifiedName~DependencyInjectionResolutionTests" --logger trx --results-directory TestResults/DependencyInjection 2>&1 | tee dependency-injection.log
          python3 scripts/validate-trx-results.py 'TestResults/DependencyInjection/*.trx' --json-output artifacts/tests/dependency-injection/test-summary.json --markdown-output artifacts/tests/dependency-injection/test-summary.md | tee -a dependency-injection.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-injection-log
          path: |
            dependency-injection.log
            TestResults/DependencyInjection/*.trx
            artifacts/tests/dependency-injection/test-summary.json
            artifacts/tests/dependency-injection/test-summary.md

  powershell-lint:
    needs: workflow-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $hasParseErrors = $false
          Remove-Item powershell-parser.log -ErrorAction SilentlyContinue
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              $message = "$($_.FullName):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)"
              $message | Tee-Object -FilePath powershell-parser.log -Append
            }
            if ($parseErrors.Count -gt 0) { $hasParseErrors = $true }
          }
          if (-not (Test-Path powershell-parser.log)) { "PowerShell parser: PASS" | Set-Content powershell-parser.log }
          if ($hasParseErrors) { exit 1 }
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error -EnableExit 2>&1 | Tee-Object -FilePath psscriptanalyzer.log
      - name: Static smoke with log
        shell: pwsh
        run: ./scripts/smoke-test-sigov.ps1 -StaticOnly 2>&1 | Tee-Object -FilePath smoke-static.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-lint-artifacts
          path: |
            powershell-parser.log
            psscriptanalyzer.log
            smoke-static.log

  migrations-manifest:
    needs: [workflow-integrity, release-context]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sigov, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d sigov" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: sigov
      PGUSER: sigov
      PGPASSWORD: sigov_ci_password
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations from manifest
        shell: pwsh
        run: ./scripts/apply-migrations-manifest.ps1 -HostName $env:PGHOST -Port ([int]$env:PGPORT) -Database $env:PGDATABASE -User $env:PGUSER 2>&1 | Tee-Object -FilePath migration.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: migrations-manifest-log, path: migration.log }

  seed-idempotency:
    needs: migrations-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sigov, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d sigov" --health-interval 10s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGDATABASE: sigov, PGUSER: sigov, PGPASSWORD: sigov_ci_password, SIGOV_DEMO_SEED_ALLOW_NON_DEV: 'true' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - shell: pwsh
        run: ./scripts/apply-migrations-manifest.ps1 -HostName $env:PGHOST -Port ([int]$env:PGPORT) -Database $env:PGDATABASE -User $env:PGUSER | Tee-Object -FilePath seed-idempotency.log
      - name: Execute homologation seed twice and compare counts
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/postgres/seeds/pos_rc_homologacao_demo.sql | tee -a seed-idempotency.log
          psql -At -f scripts/ci/pos-rc-27a-counts.sql > before.counts
          psql -v ON_ERROR_STOP=1 -f database/postgres/seeds/pos_rc_homologacao_demo.sql | tee -a seed-idempotency.log
          psql -At -f scripts/ci/pos-rc-27a-counts.sql > after.counts
          diff -u before.counts after.counts | tee -a seed-idempotency.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: seed-idempotency-log, path: 'seed-idempotency.log' }

  script-completop-validate:
    needs: workflow-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path script-completop-validate.log | Out-Null
          ./scripts/generate-script-completop.ps1 -Verify 2>&1 | Tee-Object -FilePath script-completop-validate.log -Append
          ./scripts/validate-script-completop.ps1 2>&1 | Tee-Object -FilePath script-completop-validate.log -Append
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: script-completop-validate-log, path: script-completop-validate.log }

  script-completop-idempotency:
    needs: script-completop-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sigov, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d sigov" --health-interval 10s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGDATABASE: sigov, PGUSER: sigov, PGPASSWORD: sigov_ci_password }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f script_completop.sql 2>&1 | tee script-completop-idempotency.log
          psql -At -f scripts/ci/pos-rc-27a-counts.sql > before.counts
          psql -v ON_ERROR_STOP=1 -f script_completop.sql 2>&1 | tee -a script-completop-idempotency.log
          psql -At -f scripts/ci/pos-rc-27a-counts.sql > after.counts
          diff -u before.counts after.counts | tee -a script-completop-idempotency.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: script-completop-idempotency-log, path: script-completop-idempotency.log }

  schema-equivalence:
    needs: [migrations-manifest, script-completop-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: postgres, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: sigov, PGPASSWORD: sigov_ci_password }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Compare migration schema with consolidated baseline
        shell: pwsh
        run: ./scripts/compare-schema-equivalence.ps1 -HostName $env:PGHOST -Port ([int]$env:PGPORT) -User $env:PGUSER -MigrationDatabase sigov_migrations -BaselineDatabase sigov_baseline 2>&1 | Tee-Object -FilePath schema-equivalence.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-equivalence-artifacts
          path: |
            schema-equivalence.log
            artifacts/schema-equivalence/schema-diff.md
            artifacts/schema-equivalence/schema-diff.json

  standalone-postgres-runtime:
    needs: [build-test, migrations-manifest, script-completop-idempotency]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sigov, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d sigov" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: sigov
      PGUSER: sigov
      PGPASSWORD: sigov_ci_password
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=sigov;Username=sigov;Password=sigov_ci_password
      ASPNETCORE_ENVIRONMENT: Local
      Sigov__Database__MigrationMode: ValidateOnly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: dotnet build sigov.sln --configuration Release
      - name: Start API Web Worker without Docker
        run: |
          set -euo pipefail
          mkdir -p .local/logs .local/run .local/storage
          ASPNETCORE_URLS=http://localhost:5001 dotnet run --project src/Sigov.Api/Sigov.Api.csproj --no-build --configuration Release --no-launch-profile > .local/logs/api.log 2>&1 & echo $! > .local/run/api.pid
          ASPNETCORE_URLS=http://localhost:5000 dotnet run --project src/Sigov.Web/Sigov.Web.csproj --no-build --configuration Release --no-launch-profile > .local/logs/web.log 2>&1 & echo $! > .local/run/web.pid
          dotnet run --project src/Sigov.Worker/Sigov.Worker.csproj --no-build --configuration Release --no-launch-profile > .local/logs/worker.log 2>&1 & echo $! > .local/run/worker.pid
          for attempt in $(seq 1 60); do
            echo "Tentativa de health standalone ${attempt}/60" | tee -a .local/logs/standalone-health.log
            if curl -fsS http://localhost:5001/api/health/ready && curl -fsS http://localhost:5000/; then
              kill -0 "$(cat .local/run/api.pid)"
              kill -0 "$(cat .local/run/web.pid)"
              kill -0 "$(cat .local/run/worker.pid)"
              exit 0
            fi
            sleep 5
          done
          cat .local/logs/*.log
          exit 1
      - if: always()
        run: ./scripts/stop-local.sh || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: standalone-postgres-runtime-logs, path: .local/logs/*.log }

  docker-build:
    needs: [build-test, release-context]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker version | tee docker-build.log
      - run: docker build -f src/Sigov.Api/Dockerfile -t sigov-api:${{ needs.release-context.outputs.version }} . 2>&1 | tee -a docker-build.log
      - run: docker build -f src/Sigov.Web/Dockerfile -t sigov-web:${{ needs.release-context.outputs.version }} . 2>&1 | tee -a docker-build.log
      - run: docker build -f src/Sigov.Worker/Dockerfile -t sigov-worker:${{ needs.release-context.outputs.version }} . 2>&1 | tee -a docker-build.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: docker-build-log, path: docker-build.log }

  docker-compose-e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGOV_SMOKE_USE_DEMO_KEY: 'true'
      SIGOV_SMOKE_TENANT_ID: '1'
      SIGOV_SMOKE_API_KEY: sigov_demo_local_only_2026_please_rotate
    steps:
      - uses: actions/checkout@v4
      - run: docker compose down -v || true
      - run: docker compose build --no-cache
      - run: docker compose up -d
      - name: Validate compose health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            echo "Tentativa de health Docker Compose ${attempt}/60"
            docker compose ps
            if curl -fsS http://localhost:5001/api/health/ready && curl -fsS http://localhost:8080/; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color
          exit 1
      - if: always()
        run: docker compose logs --no-color > docker-compose-e2e.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: docker-compose-e2e-log, path: docker-compose-e2e.log }
      - if: always()
        run: docker compose down -v || true

  ui-contrast:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-ui-contrast.mjs 2>&1 | tee ui-contrast.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-contrast-log, path: ui-contrast.log }

  web-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: |
          set -euo pipefail
          dotnet test tests/Sigov.IntegrationTests/Sigov.IntegrationTests.csproj --configuration Release --filter "FullyQualifiedName~WebRuntimeSmokeTests" --logger trx --results-directory TestResults/WebSmoke 2>&1 | tee web-smoke.log
          python3 scripts/validate-trx-results.py 'TestResults/WebSmoke/*.trx' --json-output artifacts/tests/web-smoke/test-summary.json --markdown-output artifacts/tests/web-smoke/test-summary.md | tee -a web-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-log
          path: |
            web-smoke.log
            TestResults/WebSmoke/*.trx
            artifacts/tests/web-smoke/test-summary.json
            artifacts/tests/web-smoke/test-summary.md

  release-package-check:
    needs: [release-context, docker-compose-e2e, ui-contrast, web-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate release package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version '${{ needs.release-context.outputs.version }}' 2>&1 | Tee-Object -FilePath package-release.log
      - name: Validate release package
        shell: pwsh
        run: ./scripts/validate-release.ps1 -PackagePath '${{ needs.release-context.outputs.release_directory }}' 2>&1 | Tee-Object -FilePath package-release.log -Append
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.release-context.outputs.artifact_name }}
          path: |
            package-release.log
            ${{ needs.release-context.outputs.release_directory }}

  go-live-check:
    needs: [workflow-integrity, release-context, build-test, dependency-injection, web-smoke, powershell-lint, migrations-manifest, seed-idempotency, script-completop-validate, script-completop-idempotency, schema-equivalence, standalone-postgres-runtime, docker-build, docker-compose-e2e, ui-contrast, release-package-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run go-live check
        shell: pwsh
        run: ./scripts/go-live-check.ps1 -ReleaseCandidateVersion '${{ needs.release-context.outputs.version }}' 2>&1 | Tee-Object -FilePath go-live.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-live-check-log
          path: |
            go-live.log
            docs/go-live-check-result.md
            docs/go-live-check-result.json
