name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=sigov;Username=sigov;Password=sigov_ci_password
      Sigov__Jwt__Secret: ci-only-secret-with-more-than-thirty-two-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: dotnet --info
      - run: dotnet restore sigov.sln
      - run: |
          set -o pipefail
          dotnet build sigov.sln --configuration Release --no-restore 2>&1 | tee build.log
      - run: |
          set -o pipefail
          dotnet test sigov.sln --configuration Release --no-build --logger trx --results-directory TestResults 2>&1 | tee test.log
      - run: dotnet format sigov.sln --verify-no-changes --no-restore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-artifacts
          path: |
            build.log
            test.log
            TestResults/**/*.trx

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker version
      - run: docker build -f src/Sigov.Api/Dockerfile -t sigov-api:${{ github.sha }} .
      - run: docker build -f src/Sigov.Web/Dockerfile -t sigov-web:${{ github.sha }} .
      - run: docker build -f src/Sigov.Worker/Dockerfile -t sigov-worker:${{ github.sha }} .

  migrations-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sigov, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d sigov" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: sigov
      PGUSER: sigov
      PGPASSWORD: sigov_ci_password
      SIGOV_DEMO_SEED_ALLOW_NON_DEV: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations from manifest
        shell: pwsh
        run: |
          $env:SIGOV_CONNECTION_STRING = "postgresql://$env:PGUSER:$env:PGPASSWORD@$env:PGHOST:$env:PGPORT/$env:PGDATABASE"
          ./scripts/apply-migrations-manifest.ps1 2>&1 | Tee-Object -FilePath migration.log
      - name: Apply demo seed twice and validate idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f database/postgres/seeds/pos_rc_homologacao_demo.sql
          before=$(psql -At -c "select count(*) from sigov.protocolo where codigo like 'DEMO-PROT-%'")
          psql -v ON_ERROR_STOP=1 -f database/postgres/seeds/pos_rc_homologacao_demo.sql
          after=$(psql -At -c "select count(*) from sigov.protocolo where codigo like 'DEMO-PROT-%'")
          test "$before" = "$after"
      - name: Schema report via psql
        shell: pwsh
        run: ./scripts/schema-report.ps1 -Mode Psql -OutputPath docs/schema-report-ci.md
      - name: Validate critical tables, demo key, scopes and no clear key
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select to_regclass('sigov.api_key'), to_regclass('sigov.api_key_escopo'), to_regclass('sigov.api_requisicao_log'), to_regclass('sigov.webhook_configuracao'), to_regclass('sigov.webhook_entrega'), to_regclass('sigov.outbox_evento'), to_regclass('sigov.protocolo'), to_regclass('sigov.documento'), to_regclass('sigov.workflow_instancia'), to_regclass('sigov.tarefa'), to_regclass('sigov.notificacao'), to_regclass('sigov.portal_validacao_documento');
          do $$
          declare missing int;
          begin
            if exists (select 1 from sigov.api_key where api_key_hash like 'sigov_demo_local_only%') then raise exception 'API key clara salva'; end if;
            if not exists (select 1 from sigov.api_key where prefixo='sigov_demo' and api_key_hash='fc86ee2b04157910a83296966cd5033de0f564cbe8dc64d1f3a54238fb32063a' and algoritmo_hash='SHA-256' and status='ATIVA') then raise exception 'API key demo inválida'; end if;
            select count(*) into missing from unnest(array['protocolos.read','protocolos.write','documentos.read','documentos.write','tarefas.read','tarefas.write','notificacoes.read','webhooks.manage','mobile.sync','assinaturas.read','assinaturas.write','bi.read']) s where not exists (select 1 from sigov.api_key k join sigov.api_key_escopo e on e.api_key_id=k.id where k.prefixo='sigov_demo' and e.escopo=s);
            if missing > 0 then raise exception 'Escopos demo ausentes: %', missing; end if;
          end $$;
          SQL
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrations-manifest-artifacts
          path: |
            migration.log
            docs/schema-report-ci.md

  powershell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $hasErrors = $false
          Remove-Item powershell-parser.log -ErrorAction SilentlyContinue
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              $message = "$($_.FullName):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)"
              $message | Tee-Object -FilePath powershell-parser.log -Append
            }
            if ($parseErrors.Count -gt 0) { $hasErrors = $true }
          }
          if (-not (Test-Path powershell-parser.log)) { "PowerShell parser: PASS" | Set-Content powershell-parser.log }
          if ($hasErrors) { exit 1 }
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error -EnableExit 2>&1 | Tee-Object -FilePath psscriptanalyzer.log
          if (-not (Test-Path psscriptanalyzer.log)) { "PSScriptAnalyzer: PASS" | Set-Content psscriptanalyzer.log }
      - name: Static Pós-RC 23A checks
        shell: pwsh
        run: |
          ./scripts/smoke-test-sigov.ps1 -StaticOnly 2>&1 | Tee-Object -FilePath smoke-static.log
          if (-not (Test-Path smoke-static.log)) { "Smoke static: PASS" | Set-Content smoke-static.log }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-lint-artifacts
          path: |
            powershell-parser.log
            psscriptanalyzer.log
            smoke-static.log
            docs/smoke-test-release-candidate.*

  docker-compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGOV_SMOKE_USE_DEMO_KEY: 'true'
      SIGOV_SMOKE_TENANT_ID: '1'
      SIGOV_SMOKE_API_KEY: sigov_demo_local_only_2026_please_rotate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: docker compose down -v || true
      - run: docker compose build --no-cache
      - run: docker compose up -d
      - name: Wait health
        run: |
          for i in {1..60}; do docker compose ps; curl -fsS http://localhost:5001/api/health/ready && curl -fsS http://localhost:8080/ && exit 0; sleep 5; done
          docker compose logs --no-color
          exit 1
      - shell: pwsh
        run: |
          ./scripts/apply-demo-seed.ps1
          ./scripts/schema-report.ps1 -Mode Docker -OutputPath docs/schema-report-pos-rc-23a.md
          ./scripts/smoke-test-sigov.ps1
      - if: always()
        run: docker compose logs --no-color > docker-compose-e2e.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-e2e-evidence
          path: |
            docs/smoke-test-release-candidate.md
            docs/smoke-test-release-candidate.json
            docs/schema-report-pos-rc-23a.md
            docs/evidencias-pos-rc-23a.md
            docs/evidencias-pos-rc-23a.json
            docker-compose-e2e.log
      - if: always()
        run: docker compose down -v || true


  script-completop-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify consolidated SQL
        shell: pwsh
        run: |
          ./scripts/generate-script-completop.ps1 -Verify
          ./scripts/validate-script-completop.ps1

  standalone-postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sigov, POSTGRES_USER: sigov, POSTGRES_PASSWORD: sigov_ci_password }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U sigov -d sigov" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: sigov
      PGUSER: sigov
      PGPASSWORD: sigov_ci_password
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=sigov;Username=sigov;Password=sigov_ci_password
      SIGOV_DB_HOST: localhost
      SIGOV_DB_PORT: 5432
      SIGOV_DB_NAME: sigov
      SIGOV_DB_USER: sigov
      SIGOV_DB_PASSWORD: sigov_ci_password
      SIGOV_API_URL: http://localhost:5001
      SIGOV_WEB_URL: http://localhost:5000
      SIGOV_RUN_WORKER: 'true'
      Sigov__Database__MigrationMode: ValidateOnly
      ASPNETCORE_ENVIRONMENT: Local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '6.0.x' }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply script_completop twice
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f script_completop.sql 2>&1 | tee script-completop-first.log
          psql -v ON_ERROR_STOP=1 -f script_completop.sql 2>&1 | tee script-completop-second.log
      - name: Ensure local startup script does not call Docker
        run: '! grep -E "docker( compose|-compose)?" scripts/start-local.ps1'
      - run: dotnet restore sigov.sln
      - run: |
          set -o pipefail
          dotnet build sigov.sln --configuration Release --no-restore 2>&1 | tee build.log
      - name: Start API Web Worker without Docker
        run: |
          mkdir -p .local/logs .local/run .local/storage
          ASPNETCORE_URLS=http://localhost:5001 dotnet run --project src/Sigov.Api/Sigov.Api.csproj --no-launch-profile > .local/logs/api.log 2>&1 & echo $! > .local/run/api.pid
          ASPNETCORE_URLS=http://localhost:5000 dotnet run --project src/Sigov.Web/Sigov.Web.csproj --no-launch-profile > .local/logs/web.log 2>&1 & echo $! > .local/run/web.pid
          dotnet run --project src/Sigov.Worker/Sigov.Worker.csproj --no-launch-profile > .local/logs/worker.log 2>&1 & echo $! > .local/run/worker.pid
          for i in {1..60}; do curl -fsS http://localhost:5001/api/health/ready && curl -fsS http://localhost:5000/ && exit 0; sleep 5; done
          cat .local/logs/api.log .local/logs/web.log .local/logs/worker.log
          exit 1
      - if: always()
        run: ./scripts/stop-local.sh || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-postgres-runtime
          path: |
            .local/logs/*.log
            script-completop-first.log
            script-completop-second.log
            docs/schema-diff-script-completop-pos-rc-19.*

  release-package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate release package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version 1.0.0-rc23a
      - name: Validate release package
        shell: pwsh
        run: |
          $pkg='artifacts/release/sigov-plus-1.0.0-rc23a'
          foreach($p in @($pkg,"$pkg/release-manifest.json","$pkg/README.md","$pkg/docs","$pkg/database/postgres/migrations","$pkg/database/postgres/seeds","$pkg/scripts")){ if(-not(Test-Path $p)){ throw "Ausente: $p" } }
          if(Test-Path "$pkg/.env"){ throw '.env real não pode estar no pacote' }
          if(Test-Path "$pkg/storage"){ throw 'storage não pode estar no pacote' }
          $pattern='(?i)(POSTGRES_PASSWORD=(?!change_me_local_only)|API_KEY=(?!change_me_local_only)|SECRET=(?!change_me_local_only)|TOKEN=(?!change_me_local_only)|PRIVATE KEY|BEGIN RSA|BEGIN CERTIFICATE|Host=.*;.*Username=.*;.*Password=(?!change_me_local_only))'
          if((Get-ChildItem $pkg -Recurse -File | Where-Object { $_.Name -ne '.env.example' } | Select-String -Pattern $pattern -Quiet)){ throw 'Secret ou credencial detectado no pacote' }
      - uses: actions/upload-artifact@v4
        with: { name: sigov-plus-1.0.0-rc23a, path: artifacts/release/sigov-plus-1.0.0-rc23a }

  go-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-test, powershell-lint, migrations-manifest, script-completop-validate, standalone-postgres-runtime, docker-build, docker-compose-e2e, release-package-check]
    steps:
      - uses: actions/checkout@v4
      - name: Generate release package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version 1.0.0-rc23a
      - name: Run Pós-RC 23A go-live check
        shell: pwsh
        run: ./scripts/go-live-check.ps1 -ReleaseCandidateVersion 1.0.0-rc23a
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-live-check-pos-rc-23a
          path: |
            docs/go-live-check-result.md
            docs/go-live-check-result.json
            artifacts/release/sigov-plus-1.0.0-rc23a


  seed-idempotency:
    needs: migrations-manifest
    runs-on: ubuntu-latest
    steps:
      - run: echo "seed-idempotency covered by migrations-manifest"

  script-completop-idempotency:
    needs: script-completop-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f script_completop.sql

  schema-equivalence:
    needs: [migrations-manifest, script-completop-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f docs/schema-diff-pos-rc-25.json && test -f docs/schema-diff-pos-rc-25.md

  ui-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-ui-contrast.mjs

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f src/Sigov.Web/Views/Shared/_Layout.cshtml

  tarefas-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f src/Sigov.Web/Controllers/TarefasController.cs || test -f src/Sigov.Api/Controllers/Operational/TarefasController.cs

  release-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/package-release.ps1 -WhatIf

  go-live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/go-live-check.ps1 -StaticOnly
