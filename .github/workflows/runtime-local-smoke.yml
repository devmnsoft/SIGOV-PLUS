name: Runtime local smoke
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', 'src/Sigov.Api/**', 'src/Sigov.Infrastructure/**', '.env*.example', '.github/workflows/runtime-local-smoke.yml']
jobs:
  database-secret-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CI database repository secret
        shell: bash
        env:
          SIGOV_CI_DB_PASSWORD: '${{ secrets.SIGOV_CI_DB_PASSWORD }}'
        run: |
          if [ -z "$SIGOV_CI_DB_PASSWORD" ]; then
            echo 'BLOCKED: configure o repository secret SIGOV_CI_DB_PASSWORD.' >&2
            exit 1
          fi

  runtime-smoke:
    needs: database-secret-preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: '${{ secrets.SIGOV_CI_DB_PASSWORD }}'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: '${{ secrets.SIGOV_CI_DB_PASSWORD }}'
      SIGOV_DB_PASSWORD: '${{ secrets.SIGOV_CI_DB_PASSWORD }}'
      SIGOV_BOOTSTRAP_ADMIN_PASSWORD: '${{ secrets.SIGOV_CI_DB_PASSWORD }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - name: Setup completo
        shell: pwsh
        run: ./scripts/setup-local-sigov.ps1 -Force -SkipBuild
      - name: Build
        run: dotnet build sigov.sln --configuration Release
      - name: Iniciar e validar processos
        shell: pwsh
        run: |
          ./scripts/start-local.ps1 -SkipBuild
          Start-Sleep 15
          ./scripts/status-local.ps1
          ./scripts/check-runtime.ps1
      - name: MigrationMode Disabled não executa runner
        run: '! rg -i "aplicando migration" .local/logs'
      - name: Artifacts não contêm secrets
        shell: bash
        run: |
          ! rg -F "$SIGOV_DB_PASSWORD" artifacts .local/logs
          ! rg -F "$SIGOV_BOOTSTRAP_ADMIN_PASSWORD" artifacts .local/logs
      - name: Stop local processes when checkout completed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath './scripts/stop-local.ps1' -PathType Leaf) {
            ./scripts/stop-local.ps1
          }
          else {
            Write-Host 'Cleanup não executado: checkout não disponibilizou scripts/stop-local.ps1.'
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-local-smoke
          path: |
            artifacts/local-setup/*.json
            artifacts/local-setup/*.md
            .local/logs/*.log
