name: regenerate-script-completop

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rc38e-one-shot-database-bootstrap
    paths:
      - 'scripts/generate-script-completop.ps1'
      - 'database/postgres/migrations/**'
      - 'database/postgres/bootstrap/**'
      - 'eng/version.json'
      - '.github/workflows/regenerate-script-completop.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-script-completop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rc38e-one-shot-database-bootstrap
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate deterministic baseline
        shell: pwsh
        run: ./scripts/generate-script-completop.ps1

      - name: Commit generated script when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- script_completop.sql; then
            echo 'script_completop.sql already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script_completop.sql
          git commit -m 'chore(database): regenerar script_completop idempotente'
          git push origin HEAD:codex/rc38e-one-shot-database-bootstrap