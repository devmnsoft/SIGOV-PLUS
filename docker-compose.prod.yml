services:
  postgres:
    image: postgres:16
    container_name: sigov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no ambiente de produção}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no ambiente de produção}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente de produção}
    volumes:
      - sigov_pgdata:/var/lib/postgresql/data
    networks:
      - sigov-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-migrations:
    image: postgres:16
    container_name: sigov-db-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente de produção}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no ambiente de produção}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no ambiente de produção}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/bash", "/database/docker/apply-migrations.sh"]
    networks:
      - sigov-internal
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Sigov.Api/Dockerfile
    container_name: sigov-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Defina ConnectionStrings__DefaultConnection em produção}
      Sigov__Database__Schema: sigov
      Sigov__Database__RunMigrationsOnStartup: "false"
      Sigov__Storage__Provider: Local
      Sigov__Storage__LocalPath: ${APP_STORAGE_PATH:-/app/storage}
      Sigov__Security__SwaggerEnabledInProduction: "false"
      OcrWorker__Enabled: ${OCR_WORKER_ENABLED:-false}
      PreviewWorker__Enabled: ${PREVIEW_WORKER_ENABLED:-false}
      Workers__LoanOverdue__Enabled: ${LOAN_OVERDUE_WORKER_ENABLED:-false}
    volumes:
      - sigov_storage:/app/storage
    networks:
      - sigov-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: src/Sigov.Worker/Dockerfile
    container_name: sigov-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Defina ConnectionStrings__DefaultConnection em produção}
      Workers__Outbox__Enabled: ${OUTBOX_WORKER_ENABLED:-false}
      OcrWorker__Enabled: ${OCR_WORKER_ENABLED:-false}
      PreviewWorker__Enabled: ${PREVIEW_WORKER_ENABLED:-false}
      Workers__LoanOverdue__Enabled: ${LOAN_OVERDUE_WORKER_ENABLED:-false}
    networks:
      - sigov-internal

  web:
    build:
      context: .
      dockerfile: src/Sigov.Web/Dockerfile
    container_name: sigov-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Defina ConnectionStrings__DefaultConnection em produção}
      Sigov__ApiBaseUrl: http://api:8080
      Sigov__Brand__Name: ${SIGOV_BRANDING_NAME:-SIGOV}
      Sigov__ReleaseChannel: ${SIGOV_RELEASE_CHANNEL:-prod}
      OcrWorker__Enabled: ${OCR_WORKER_ENABLED:-false}
      PreviewWorker__Enabled: ${PREVIEW_WORKER_ENABLED:-false}
      Workers__LoanOverdue__Enabled: ${LOAN_OVERDUE_WORKER_ENABLED:-false}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    volumes:
      - sigov_storage:/app/storage
    networks:
      - sigov-internal
      - sigov-public
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  sigov_pgdata:
  sigov_storage:

networks:
  sigov-internal:
    internal: true
  sigov-public:
